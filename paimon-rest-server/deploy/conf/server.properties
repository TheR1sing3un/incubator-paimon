# ============================================================
# Paimon REST Catalog Server Configuration
# ============================================================

# ---- Hadoop ----
rest-server.hadoop-user-name=hudi

# ---- Catalog ----
warehouse=viewfs://hadoop-lt-cluster/home/hudi/paimon
metastore=filesystem

# ---- Server ----
rest-server.host=0.0.0.0
rest-server.port=26754
rest-server.prefix=paimon
rest-server.io-threads=4
rest-server.worker-threads=16
rest-server.max-content-length=10485760
rest-server.so-backlog=1024
rest-server.metadata.resource-id=paimonCatalog

# ---- Metadata Store (MySQL) ----
