# ============================================================
# Paimon REST Catalog Server - Docker Configuration
# JDBC points to local MySQL inside the container
# ============================================================

# ---- Catalog ----
warehouse=/tmp/paimon/warehouse
metastore=filesystem

# ---- Server ----
rest-server.host=0.0.0.0
rest-server.port=26754
rest-server.prefix=paimon
rest-server.io-threads=4
rest-server.worker-threads=16
rest-server.max-content-length=10485760

# ---- Metadata Store (local MySQL) ----
rest-server.metadata.jdbc-url=jdbc:mysql://127.0.0.1:3306/paimon_catalog?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
rest-server.metadata.jdbc-user=paimon
rest-server.metadata.jdbc-password=paimon123
rest-server.metadata.pool.max-size=10
rest-server.metadata.pool.min-idle=2
rest-server.metadata.pool.connection-timeout-ms=30000
